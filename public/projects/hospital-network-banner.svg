<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b14" />
      <stop offset="50%" stop-color="#051726" />
      <stop offset="100%" stop-color="#010810" />
    </linearGradient>
    <pattern id="netGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(14, 165, 233, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#netBg)"/>
  <rect width="100%" height="100%" fill="url(#netGrid)"/>

  <!-- Glowing aura in center -->
  <circle cx="600" cy="330" r="260" fill="#0284c7" opacity="0.12" filter="blur(80px)"/>

  <!-- Network Title Overlay -->
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#f8fafc">Wireless Secure Hospital Network</text>
  <text x="80" y="100" font-family="monospace" font-size="14" fill="#38bdf8">CISCO PACKET TRACER // DMZ SEGREGATION // ZERO TRUST VLAN ARCHITECTURE</text>

  <!-- Network Connections (Lines) -->
  <!-- Internet to Edge Router -->
  <line x1="200" y1="220" x2="380" y2="220" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Router to Core Firewall -->
  <line x1="380" y1="220" x2="600" y2="220" stroke="#38bdf8" stroke-width="3.5"/>

  <!-- Core Firewall to DMZ Switch -->
  <line x1="600" y1="220" x2="600" y2="400" stroke="#f59e0b" stroke-width="3"/>
  
  <!-- Core Firewall to Internal Core Switch -->
  <line x1="600" y1="220" x2="880" y2="220" stroke="#10b981" stroke-width="3.5"/>

  <!-- Internal Switch to VLAN 10, 20, 30 -->
  <line x1="880" y1="220" x2="800" y2="390" stroke="#10b981" stroke-width="2.5"/>
  <line x1="880" y1="220" x2="940" y2="390" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="880" y1="220" x2="1080" y2="390" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Nodes / Routers -->
  <!-- 1. Internet Cloud -->
  <g transform="translate(130, 175)">
    <rect width="130" height="90" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <text x="65" y="42" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#38bdf8">🌐</text>
    <text x="65" y="68" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#94a3b8">ISP / WAN</text>
  </g>

  <!-- 2. Edge Gateway Router -->
  <g transform="translate(320, 175)">
    <circle cx="60" cy="45" r="45" fill="#0f263e" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="42" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="60" y="65" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#e2e8f0">Router 2911</text>
  </g>

  <!-- 3. Enterprise Firewall (Centerpiece) -->
  <g transform="translate(530, 160)">
    <rect width="140" height="120" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="110" height="90" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="70" y="55" font-family="sans-serif" font-size="28" text-anchor="middle" fill="#818cf8">🛡️</text>
    <text x="70" y="80" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle" fill="#ffffff">FIREWALL ASA</text>
    <text x="70" y="95" font-family="monospace" font-size="10" text-anchor="middle" fill="#a5b4fc">DMZ Filtering</text>
  </g>

  <!-- 4. DMZ Perimeter (Bottom Center) -->
  <g transform="translate(510, 370)">
    <rect width="180" height="180" rx="14" fill="#1c1917" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="90" y="30" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#fbbf24">ZONE: DMZ (ISOLATED)</text>
    <rect x="25" y="50" width="130" height="48" rx="8" fill="#292524" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="75" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#fef3c7">Web Portal Server</text>
    <text x="90" y="90" font-family="monospace" font-size="9" text-anchor="middle" fill="#d97706">192.168.50.10</text>
    <rect x="25" y="110" width="130" height="48" rx="8" fill="#292524" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="135" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#fef3c7">Public DNS / Mail</text>
    <text x="90" y="150" font-family="monospace" font-size="9" text-anchor="middle" fill="#d97706">192.168.50.20</text>
  </g>

  <!-- 5. Core Switch L3 -->
  <g transform="translate(820, 175)">
    <rect width="120" height="90" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="45" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#34d399">🔀</text>
    <text x="60" y="70" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#ecfdf5">Switch 3560 L3</text>
  </g>

  <!-- 6. VLAN Segments (Bottom Right) -->
  <!-- VLAN 10: Medical ICU -->
  <g transform="translate(730, 410)">
    <rect width="120" height="130" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="60" y="28" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#5eead4">VLAN 10</text>
    <text x="60" y="44" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#99f6e4">ICU &amp; Telemetry</text>
    <text x="60" y="80" font-family="sans-serif" font-size="24" text-anchor="middle">🏥</text>
    <text x="60" y="112" font-family="monospace" font-size="9" text-anchor="middle" fill="#2dd4bf">Strict Isolated</text>
  </g>

  <!-- VLAN 20: Admin Staff -->
  <g transform="translate(870, 410)">
    <rect width="120" height="130" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="28" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#d8b4fe">VLAN 20</text>
    <text x="60" y="44" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#e9d5ff">Staff &amp; Doctors</text>
    <text x="60" y="80" font-family="sans-serif" font-size="24" text-anchor="middle">💻</text>
    <text x="60" y="112" font-family="monospace" font-size="9" text-anchor="middle" fill="#c084fc">EHR Access</text>
  </g>

  <!-- VLAN 30: Guest Wi-Fi -->
  <g transform="translate(1010, 410)">
    <rect width="120" height="130" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="60" y="28" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fca5a5">VLAN 30</text>
    <text x="60" y="44" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#fee2e2">Guest Patients</text>
    <text x="60" y="80" font-family="sans-serif" font-size="24" text-anchor="middle">📶</text>
    <text x="60" y="112" font-family="monospace" font-size="9" text-anchor="middle" fill="#f87171">No LAN Access</text>
  </g>
</svg>
