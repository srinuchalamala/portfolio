<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="250" cy="200" r="180" fill="#00f2fe" opacity="0.1" filter="blur(60px)"/>
  <circle cx="950" cy="450" r="220" fill="#6366f1" opacity="0.12" filter="blur(70px)"/>

  <!-- UI Window Container -->
  <rect x="120" y="80" width="960" height="515" rx="16" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <path d="M 120 80 Q 120 80 120 80 L 1080 80 A 16 16 0 0 1 1080 96 L 1080 135 L 120 135 Z" fill="#0b172a" />
  <circle cx="155" cy="108" r="6" fill="#ef4444" />
  <circle cx="175" cy="108" r="6" fill="#f59e0b" />
  <circle cx="195" cy="108" r="6" fill="#10b981" />
  
  <!-- Search/URL Bar -->
  <rect x="230" y="96" width="500" height="25" rx="6" fill="#1e293b" />
  <text x="245" y="113" font-family="monospace" font-size="12" fill="#38bdf8">https://manaclg.web.app/jntuk/cse/materials</text>
  
  <!-- Brand Header inside mock -->
  <text x="170" y="200" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#f8fafc">ManaClg Study Hub</text>
  <text x="170" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">JNTUK Academic Resource &amp; Material Engine</text>

  <!-- Tags -->
  <rect x="170" y="260" width="90" height="28" rx="6" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
  <text x="185" y="278" font-family="sans-serif" font-size="12" font-weight="600" fill="#00f2fe">R20 / R19</text>

  <rect x="270" y="260" width="110" height="28" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
  <text x="283" y="278" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">B.Tech Notes</text>

  <rect x="390" y="260" width="90" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="403" y="278" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Firebase</text>

  <!-- Grid Cards inside UI -->
  <!-- Card 1 -->
  <rect x="170" y="315" width="260" height="210" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="190" y="335" width="40" height="40" rx="8" fill="rgba(0, 242, 254, 0.1)"/>
  <text x="202" y="360" font-family="monospace" font-size="20" fill="#00f2fe">📄</text>
  <text x="190" y="405" font-family="sans-serif" font-weight="700" font-size="17" fill="#f1f5f9">Cyber Security</text>
  <text x="190" y="430" font-family="sans-serif" font-size="13" fill="#64748b">Semester 3-1 &amp; 3-2 Notes</text>
  <rect x="190" y="470" width="100" height="26" rx="4" fill="#00f2fe" />
  <text x="210" y="487" font-family="sans-serif" font-weight="600" font-size="11" fill="#0f172a">Download PDF</text>

  <!-- Card 2 -->
  <rect x="460" y="315" width="260" height="210" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="480" y="335" width="40" height="40" rx="8" fill="rgba(99, 102, 241, 0.1)"/>
  <text x="492" y="360" font-family="monospace" font-size="20" fill="#818cf8">📊</text>
  <text x="480" y="405" font-family="sans-serif" font-weight="700" font-size="17" fill="#f1f5f9">Previous Papers</text>
  <text x="480" y="430" font-family="sans-serif" font-size="13" fill="#64748b">10-Year Question Archive</text>
  <rect x="480" y="470" width="100" height="26" rx="4" fill="#6366f1" />
  <text x="500" y="487" font-family="sans-serif" font-weight="600" font-size="11" fill="#ffffff">Browse Solved</text>

  <!-- Card 3 -->
  <rect x="750" y="315" width="280" height="210" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="770" y="335" width="40" height="40" rx="8" fill="rgba(16, 185, 129, 0.1)"/>
  <text x="782" y="360" font-family="monospace" font-size="20" fill="#34d399">🎥</text>
  <text x="770" y="405" font-family="sans-serif" font-weight="700" font-size="17" fill="#f1f5f9">Curated Lectures</text>
  <text x="770" y="430" font-family="sans-serif" font-size="13" fill="#64748b">Syllabus-mapped videos</text>
  <rect x="770" y="470" width="100" height="26" rx="4" fill="#10b981" />
  <text x="793" y="487" font-family="sans-serif" font-weight="600" font-size="11" fill="#0f172a">Watch Module</text>
</svg>
